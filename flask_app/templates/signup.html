{% extends "base.html" %}
{% block title %}Sign Up - News Recommender{% endblock %}
{% block content %}
    <div class="auth-form">
        <h1>Create Your Account</h1>
        <p class="landing-sub" style="margin-bottom: 24px;">Join to unlock smart reading recommendations, customized local news, and AI verification.</p>
        <form method="POST">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus>
            
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>
            
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" minlength="4" required>
            
            <button type="submit" class="cta-button" style="width: 100%; margin-top: 8px;">Sign Up & Get Started</button>
        </form>
        <p style="margin-top: 20px; text-align: center;">Already have an account? <a href="{{ url_for('login') }}" style="font-weight: 600; color: var(--accent);">Log in</a></p>
    </div>
{% endblock %}
